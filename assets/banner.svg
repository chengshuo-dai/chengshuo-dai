<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lucas CS - Agentic AI Engineer</title>
  <desc id="desc">A dark technical banner for an AI engineer focused on agentic RAG and LLM systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.45" stop-color="#0E1B2F"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="70" x2="1120" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 130) rotate(125) scale(390 260)">
      <stop stop-color="#2DD4BF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.83 0 0 0 0 0.93 0 0 0 0.55 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" stroke="#93A4B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="2"/>

  <g opacity="0.9">
    <path d="M820 87C901 48 1018 60 1087 130C1143 186 1138 266 1086 315C1017 380 882 373 809 302C747 241 750 121 820 87Z" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M840 136C899 98 997 112 1046 162C1091 208 1086 267 1043 302C988 348 890 341 837 288C790 240 790 168 840 136Z" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="865" cy="116" r="5" fill="#22D3EE"/>
    <circle cx="1062" cy="274" r="5" fill="#2DD4BF"/>
    <circle cx="996" cy="97" r="4" fill="#A78BFA"/>
    <circle cx="819" cy="288" r="4" fill="#38BDF8"/>
  </g>

  <g filter="url(#softGlow)">
    <rect x="87" y="74" width="152" height="38" rx="19" fill="#0B1220" stroke="#22D3EE" stroke-opacity="0.45"/>
    <text x="112" y="99" fill="#A7F3D0" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15">AGENTIC AI</text>
  </g>

  <text x="86" y="170" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Lucas CS</text>
  <text x="88" y="218" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Agentic RAG systems. Streaming AI apps. Production LLM infrastructure.</text>

  <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="16">
    <rect x="88" y="263" width="214" height="46" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="111" y="292" fill="#67E8F9">retrieve</text>
    <text x="190" y="292" fill="#94A3B8">+</text>
    <text x="210" y="292" fill="#C4B5FD">rerank</text>

    <rect x="318" y="263" width="205" height="46" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="342" y="292" fill="#C4B5FD">reflect</text>
    <text x="421" y="292" fill="#94A3B8">+</text>
    <text x="441" y="292" fill="#5EEAD4">route</text>

    <rect x="539" y="263" width="212" height="46" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="563" y="292" fill="#5EEAD4">stream</text>
    <text x="634" y="292" fill="#94A3B8">+</text>
    <text x="654" y="292" fill="#67E8F9">ship</text>
  </g>

  <g transform="translate(817 183)">
    <rect width="270" height="104" rx="16" fill="#0B1220" fill-opacity="0.78" stroke="#334155"/>
    <circle cx="30" cy="30" r="6" fill="#22D3EE"/>
    <circle cx="30" cy="55" r="6" fill="#7C3AED"/>
    <circle cx="30" cy="80" r="6" fill="#2DD4BF"/>
    <path d="M30 36V49M30 61V74M36 30H88M36 55H118M36 80H98" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <text x="138" y="38" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">RAG Pipeline</text>
    <text x="138" y="66" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">query -> retrieve -> answer</text>
  </g>
</svg>
